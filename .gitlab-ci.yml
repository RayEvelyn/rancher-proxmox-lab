# Use a separate unprivileged validation runner; homelab is protected deployment-only.
stages: [validate, deploy]
validate:
  stage: validate
  tags: [validation]
  script:
    - terraform fmt -check -recursive && terraform init -backend=false -input=false && terraform validate && ansible-playbook -i ansible/inventory.baremetal.example.yml ansible/site.yml --syntax-check
    - for script in scripts/*.sh; do bash -n "$script"; done
    - shellcheck scripts/*.sh
deploy:
  stage: deploy
  tags: [homelab]
  resource_group: homelab
  environment: homelab
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PROJECT_VISIBILITY == "private" && $DEPLOY_ENABLED == "true"'
      when: manual
    - when: never
  variables:
    HOMELAB_ACTION: plan
    HOMELAB_PRIVATE_REPOSITORY: "true"
  script:
    - export TF_REPOSITORY_ID="${TF_REPOSITORY_ID:-gitlab-$CI_PROJECT_ID}"
    - ./scripts/ci-deploy.sh
