# Lab-only private CA. Clients must trust the generated CA; never disable verification.
replicas: 1
hostname: rancher.example.test
agentTLSMode: strict
ingress:
  ingressClassName: traefik
  tls:
    source: rancher
resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: '2'
    memory: 3Gi
